<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janji Temu</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-3xl mx-auto mt-10 bg-white rounded-xl shadow-lg">

    <!-- Header -->
    <div class="bg-brand-950 text-white p-5 rounded-t-xl">
        <h1 class="text-2xl font-bold">📅 Janji Temu Pasien</h1>
        <p>Silakan isi formulir untuk membuat janji temu dengan dokter.</p>
    </div>

    <!-- Form -->
    <form class="p-6 space-y-4">

        <div>
            <label class="block font-medium mb-1">Nama Pasien</label>
            <input
                type="text"
                placeholder="Masukkan nama lengkap"
                class="w-full border rounded-lg px-4 py-2"
                required>
        </div>

        <div>
            <label class="block font-medium mb-1">Nomor Rekam Medis</label>
            <input
                type="text"
                placeholder="Contoh: RM001234"
                class="w-full border rounded-lg px-4 py-2">
        </div>

        <div>
            <label class="block font-medium mb-1">Pilih Poli</label>
            <select class="w-full border rounded-lg px-4 py-2">
                <option>Poli Jantung</option>
                <option>Poli Jiwa</option>
                <option>Poli Obgyn</option>
                <option>Poli Orthopedi</option>
                <option>Poli THT</option>
            </select>
        </div>

        <div>
            <label class="block font-medium mb-1">Pilih Dokter</label>
            <select class="w-full border rounded-lg px-4 py-2">
                <option>dr. Ahmad</option>
                <option>dr. Siti</option>
                <option>dr. Budi</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-medium mb-1">Tanggal Kunjungan</label>
                <input
                  id="event-start-date"
                  type="date"
                  class="w-full border rounded-lg px-4 py-2"
                  onclick="this.showPicker()"
                />
            </div>

            <div>
                <label class="block font-medium mb-1">Jam Kunjungan</label>
                <input
                    type="time"
                    class="w-full border rounded-lg px-4 py-2">
            </div>
        </div>

        <div>
            <label class="block font-medium mb-1">Keluhan Singkat</label>
            <textarea
                rows="4"
                placeholder="Tuliskan keluhan utama..."
                class="w-full border rounded-lg px-4 py-2"></textarea>
        </div>

        <!-- Tombol -->
        <div class="flex justify-end gap-3 pt-4">

            <a
                href="index.html"
                class="bg-gray-500 text-white px-5 py-2 rounded-lg hover:bg-gray-600">
                Kembali
            </a>

            <button
                type="reset"
                class="bg-yellow-500 text-white px-5 py-2 rounded-lg hover:bg-yellow-600">
                Reset
            </button>

            <button
                type="submit"
                onclick="alert('Janji temu berhasil dibuat!')"
                class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700">
                Buat Janji Temu
            </button>

        </div>

    </form>

</div>

</body>
</html>
